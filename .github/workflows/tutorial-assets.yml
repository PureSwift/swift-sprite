name: Tutorial assets

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  download-and-extract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Cache tutorial ZIP
        uses: actions/cache@v4
        with:
          path: .build/tutorials/2D_Apple_Games_by_Tutorials_3.0.zip
          key: tutorial-2d-apple-games-3-${{ hashFiles('Scripts/download-tutorial.py') }}
      # Always run, including cache hits: verify the checksum and extract a fresh copy.
      - name: Download, extract, and verify tutorial samples
        run: python3 Scripts/download-tutorial.py
